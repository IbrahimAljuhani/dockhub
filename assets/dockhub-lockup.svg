<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 295" width="442" height="295"
     class="x-mk x-pulse run" role="img"
     aria-label="DockHub — your self-hosted server, simplified">
  <title>DockHub</title>

  <!--
    One file, two homes.

    Standalone, this is a complete asset: it carries its own colours, its own
    animation, and its own light/dark handling. Inlined into index.html it
    picks up the page's tokens instead, so the manual theme toggle governs it
    like everything else.

    That is what the two-level var() does: it asks for the page's "signal"
    token first and falls back to this file's own "mk-signal" when nothing
    is inherited. The fallbacks are deliberately given DIFFERENT names.
    Defining the page's own token names in here would override the values it
    sets and break the light theme, which is exactly the custom-property
    trap this project has already paid for once.

    (Note for future edits: this is XML, not HTML. A comment may not contain
    two hyphens in a row, so token names are written in quotes above.)
  -->
  <style>
    svg{
      --mk-signal:#F0714A;   /* dark theme, the default */
      --mk-text:#DEE7E7;
      --mk-faint:#748A8D;
    }
    @media (prefers-color-scheme: light){
      svg{ --mk-signal:#BF3F1B; --mk-text:#0F1E20; --mk-faint:#5A6B6C }
    }

    .x-mk{ overflow:visible }
    .hl{ fill:var(--text, var(--mk-text)) }
    .sp{ stroke:var(--text, var(--mk-text)); stroke-width:2.5; stroke-linecap:round;
         fill:none; opacity:.4 }
    .nd{ fill:var(--text, var(--mk-text)); opacity:.55 }
    .sg{ fill:var(--signal, var(--mk-signal)) }

    /* Resting state is the finished state. Motion is added by .run and is
       never what makes the mark arrive. */
    .lv{ fill:var(--signal, var(--mk-signal)); opacity:0 }
    .tv{ stroke:var(--signal, var(--mk-signal)); stroke-width:3.4; stroke-linecap:round;
         fill:none; stroke-dasharray:5 60; stroke-dashoffset:0; opacity:0 }

    @keyframes x-flash{ 0%{opacity:0} 6%{opacity:1} 34%{opacity:1} 52%{opacity:0} 100%{opacity:0} }
    @keyframes x-travel{ 0%{opacity:0;stroke-dashoffset:0} 8%{opacity:1}
      46%{opacity:1;stroke-dashoffset:-15} 56%{opacity:0;stroke-dashoffset:-15}
      100%{opacity:0;stroke-dashoffset:-15} }
    @keyframes x-ack{ 0%{transform:scaleY(1)} 18%{transform:scaleY(1.5)}
      55%{transform:scaleY(1)} 100%{transform:scaleY(1)} }

    .x-pulse.run .lv{ animation:x-flash  4.5s linear infinite }
    .x-pulse.run .tv{ animation:x-travel 4.5s linear infinite }
    .x-pulse.run .k1{ animation-delay:0s }    .x-pulse.run .k2{ animation-delay:.75s }
    .x-pulse.run .k3{ animation-delay:1.5s }  .x-pulse.run .k4{ animation-delay:2.25s }
    .x-pulse.run .k5{ animation-delay:3s }    .x-pulse.run .k6{ animation-delay:3.75s }
    .x-pulse.run .sg{ transform-box:fill-box; transform-origin:50% 100%;
      animation:x-ack .75s ease-out .255s infinite }

    @media (prefers-reduced-motion: reduce){
      /* A full stop, not a slowdown. */
      .x-pulse.run *{ animation:none !important }
    }

    .wm, .tag{
      font-family:ui-monospace, "Cascadia Mono", "SF Mono", "JetBrains Mono",
                  Menlo, Consolas, monospace;
    }
    .wm { font-size:58px; font-weight:600; letter-spacing:-2.03px }
    .wm-dock{ fill:var(--text,   var(--mk-text))   }
    .wm-hub { fill:var(--signal, var(--mk-signal)) }
    .tag{ font-size:12px; font-weight:400; letter-spacing:4.2px;
          fill:var(--text-faint, var(--mk-faint)) }
  </style>

  <mask id="x-cargo">
    <path fill="#fff" d="M50 26 L72 38 L72 62 L50 74 L28 62 L28 38 Z"/>
    <rect fill="#000" x="36"   y="57.5" width="28" height="7"/>
    <rect fill="#000" x="39.5" y="46.5" width="21" height="7"/>
    <rect fill="#000" x="43"   y="35.5" width="14" height="7"/>
  </mask>

  <!-- The mark, unchanged, scaled 1.6x and centred on x=221. Its own 100 unit
       box becomes 160 so it still outweighs the wordmark under it instead of
       being shrunk to fit the tagline's width.

       Every number below the mark was set from the rendered bounding boxes,
       not guessed: the drawing sits 24 units clear of all four edges, and the
       three elements share the x=221 axis exactly. Note the mark's own bbox
       is 78x82 rather than the full 100 grid, because the grid is the
       construction square and the artwork is inset within it. Reframing off
       the grid instead of the bbox is what left 22 units of air above and 9
       below in the first cut. -->
  <g transform="translate(141 9.6) scale(1.6)">
    <path class="sp" d="M50 26 L50 14"/><path class="sp" d="M72 38 L84 31"/>
    <path class="sp" d="M72 62 L84 69"/><path class="sp" d="M50 74 L50 86"/>
    <path class="sp" d="M28 62 L16 69"/><path class="sp" d="M28 38 L16 31"/>
    <path class="tv k1" d="M50 14 L50 26"/><path class="tv k2" d="M84 31 L72 38"/>
    <path class="tv k3" d="M84 69 L72 62"/><path class="tv k4" d="M50 86 L50 74"/>
    <path class="tv k5" d="M16 69 L28 62"/><path class="tv k6" d="M16 31 L28 38"/>
    <circle class="nd" cx="50" cy="14" r="5"/><circle class="nd" cx="84" cy="31" r="5"/>
    <circle class="nd" cx="84" cy="69" r="5"/><circle class="nd" cx="50" cy="86" r="5"/>
    <circle class="nd" cx="16" cy="69" r="5"/><circle class="nd" cx="16" cy="31" r="5"/>
    <circle class="lv k1" cx="50" cy="14" r="5"/><circle class="lv k2" cx="84" cy="31" r="5"/>
    <circle class="lv k3" cx="84" cy="69" r="5"/><circle class="lv k4" cx="50" cy="86" r="5"/>
    <circle class="lv k5" cx="16" cy="69" r="5"/><circle class="lv k6" cx="16" cy="31" r="5"/>
    <path class="hl" d="M50 26 L72 38 L72 62 L50 74 L28 62 L28 38 Z" mask="url(#x-cargo)"/>
    <rect class="sg" x="43" y="35.5" width="14" height="7"/>
  </g>

  <!-- Centred rather than left-aligned: with the mark stacked above it this
       is a lockup, and a centred mark over left-aligned type reads as a
       mistake. Both lines share the x=210 axis the mark sits on. -->
  <text class="wm" x="221" y="239" text-anchor="middle"
    ><tspan class="wm-dock">dock</tspan><tspan class="wm-hub">hub</tspan></text>
  <!-- textLength pins the tagline to the 393 units it measures with the fonts
       named above. This file is going to be rendered on machines that have
       none of them, falling back to whatever `monospace` means there — and
       mono advance widths run from about .55em to .65em, which at 34
       characters plus 4.2 of letter-spacing is enough drift to push the line
       past the viewBox and get it clipped. lengthAdjust="spacing" absorbs the
       difference between the letters instead of stretching them, so the
       glyphs keep their shape. -->
  <text class="tag" x="221" y="267" text-anchor="middle"
        textLength="393" lengthAdjust="spacing">your self-hosted server, simplified</text>
</svg>
