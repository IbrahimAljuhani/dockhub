# OpenHands — the third AGENT in DockHub, and the one that is not an assistant.
#
# OpenClaw and Hermes are personal assistants: you message them and they act.
# OpenHands is a SOFTWARE ENGINEERING assistant — it writes code, runs it,
# and browses. Different job, different risk shape, and the only service in
# this category that cannot be deployed without the Docker socket.
#
# Read services/AI-Agents/README.md first. The category threat model is what
# every decision below comes from.
#
# ── 1. THE SOCKET IS REQUIRED, NOT OFFERED ──────────────────────────────
# OpenHands starts a fresh runtime container per session — that is how it
# sandboxes the code it writes from itself. To do that it must reach the
# Docker daemon.
#
# So the ruling this repo made for the other two ("optional, off by
# default") cannot apply. There is no OpenHands without the socket, and
# deploy.sh therefore asks for a TYPED acknowledgement rather than a y/n.
#
# The intent is security-POSITIVE — isolation is the point. The effect on
# the host is the same one that makes Portainer sensitive: anything reaching
# that socket can start a privileged container, which is root-equivalent.
# What differs from Portainer is who holds the trigger: you, versus a
# language model acting on text it did not write.
#
# ── 2. IT HAS NO AUTHENTICATION. THIS IS THE IMPORTANT ONE. ─────────────
# The other two agents in this category REFUSE to bind a non-loopback
# address without credentials. OpenHands has no such gate — it boots
# straight to a settings screen, and anyone who can reach the port has a
# fully privileged agent with the Docker socket behind it.
#
# Upstream says so itself: bind 127.0.0.1, reach it through a reverse proxy
# with TLS, and expose it only behind an API key plus a firewall or VPN.
# The "hardened" third-party offering adds HTTP basic auth in nginx IN FRONT
# of OpenHands — because OpenHands does not have any.
#
# Hence the host port here is published to 127.0.0.1 ONLY, never the LAN.
# The documented route in is an SSH tunnel:
#     ssh -D 1080 you@server        + a browser SOCKS5 proxy
#
# A port tunnel (-L) is NOT sufficient: each session's runtime publishes
# its own randomly-numbered ports that the browser must also reach, so
# there is nothing fixed to forward. deploy.sh prints the full recipe.
# Same treatment as Hermes' dashboard, for a stronger reason.
#
# ── 3. PORT 3001, NOT 3000 ──────────────────────────────────────────────
# Upstream publishes 3000. That is Open WebUI's default in this catalogue —
# and Open WebUI is exactly what someone deploying an agent already runs.
# Redmine and Juice Shop are on it too. So DockHub defaults to 3001.
#
# ── 4. TWO IMAGES, NOT ONE ──────────────────────────────────────────────
# The app image below, plus a runtime image it pulls at session start:
#     AGENT_SERVER_IMAGE_REPOSITORY / AGENT_SERVER_IMAGE_TAG
# Pinned in .env rather than floating, because a runtime that silently
# changes under a working setup is a debugging problem nobody wants. Both
# are pulled up front by deploy.sh so the first session is not a surprise
# multi-gigabyte download.
#
# ── 5. THE MODEL IS SET IN THE UI, AND ONLY THERE ───────────────────────
# No environment variable configures it. Unlike Hermes — whose config.yaml
# let deploy.sh write the model in — this one cannot be scripted at all.
# deploy.sh prints the exact endpoint to paste and leaves it at that.
#
# ── 6. THE CALLBACK — WHY LOOPBACK ALONE IS NOT ENOUGH ──────────────────
# The two containers talk in BOTH directions, and the return leg is the
# one that breaks silently.
#
#   app  →  runtime    over the Docker socket and a published port
#   runtime  →  app    over HTTP, to OH_WEBHOOKS_0_BASE_URL
#
# Everything the agent does — its reply, its tool calls, its output —
# reaches you only over that second arrow. If it fails, the UI shows no
# error. Your message is written to a pending_messages table with a queue
# position and simply never answered, which reads like a dead model.
#
# The runtime is started on the DEFAULT bridge network, not ai-net, so it
# cannot resolve the container name `openhands`. It has exactly one route
# home: the docker0 gateway, via the host.docker.internal entry below.
# That means the app's port must exist ON THE GATEWAY, not on loopback
# alone — so deploy.sh publishes it twice, with DIFFERENT host ports:
#
#     127.0.0.1:$OH_PORT:3000          ← you, through the SSH tunnel
#     <docker0 gateway>:3000:3000      ← the session runtime, calling back
#
# ⚠️ The 3000 on that second line is not a typo and is not adjustable.
# The app listens on 3000 inside its container, and it tells every runtime
# to call back on "host.docker.internal:3000" — assuming the host publishes
# the same number it uses internally. DockHub does not: block 3 above moves
# the human-facing port to 3001 to stay clear of Open WebUI.
#
# Verified on a live server, from inside a session runtime:
#     wget host.docker.internal:3000 → nothing listening
#     wget host.docker.internal:3001 → the full OpenHands page
# with the app's own OH_WEBHOOKS_0_BASE_URL correctly set to 3001. So the
# app does not hand that setting down to the sessions it spawns; pinning
# the gateway binding to 3000 is the only thing that actually works.
#
# Because 3000 is fixed, a collision there is fatal rather than annoying —
# deploy.sh checks for one up front and refuses, instead of letting it
# surface later as an agent that never replies.
#
# deploy.sh asks Docker for the gateway address rather than assuming
# 172.17.0.1, because a host with a custom address pool will differ — and
# a wrong value fails silently at the first message, not at deploy time.
#
# ⚠️ Be clear about what the second binding costs. The gateway is NOT
# reachable from your LAN, so the tunnel-only rule for humans still
# holds. It IS reachable from every other container on this host's
# default bridge. An unauthenticated privileged agent is therefore
# exposed to any container running beside it. That is a real widening,
# and it is accepted here for one reason: it does not exceed the trust
# already granted by mounting the Docker socket, and without it the
# service does not function at all.
#
# This is a single-instance service, under ~/docker/openhands/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/openhands/ and runs it from there.

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:${OPENHANDS_TAG:-1.8}
    container_name: openhands
    restart: unless-stopped
    environment:
      # Which runtime image sessions get. Repository and tag are separate
      # variables upstream, so they stay separate here.
      AGENT_SERVER_IMAGE_REPOSITORY: ${AGENT_SERVER_IMAGE_REPOSITORY}
      AGENT_SERVER_IMAGE_TAG: ${AGENT_SERVER_IMAGE_TAG}
      # Upstream's own run command sets this. Kept because their default
      # runtime configuration may reference it; DockHub's own guidance
      # always points at container names on ai-net instead.
      LOG_ALL_EVENTS: "true"
      # Belt and braces — NOT the fix. Read block 6 before touching it.
      #
      # An earlier revision of this file called this line "load-bearing".
      # That was wrong, and a live test disproved it: the app carried this
      # variable correctly (`docker exec openhands env` showed :3001) while
      # its session runtime went on dialling :3000 regardless. The app does
      # not propagate this setting to the runtimes it starts.
      #
      # What actually carries the callback is the gateway binding pinned to
      # port 3000 in deploy.sh. This variable is kept only because it is
      # upstream's documented knob for the app's own webhook config, and a
      # correct value costs nothing. Do not expect changing it to move the
      # port a session dials — it will not.
      OH_WEBHOOKS_0_BASE_URL: "http://host.docker.internal:${OH_PORT}/api/v1/webhooks"
    volumes:
      # Settings, secrets, conversations and the agent's working copies.
      # A bind mount, not a named volume: this is real user data — the
      # Backup option in the menu should capture it as part of the tree,
      # exactly as for the other two agents.
      - ./state:/.openhands
      # ⚠️ Required. See block 1. deploy.sh will not write this file at all
      # unless you typed the acknowledgement.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # NOT decoration, and not only for this container. Verified on a live
      # deployment: OpenHands copies this entry onto every session runtime
      # it starts, and `docker inspect` on the runtime shows
      #     ["host.docker.internal:host-gateway"]
      # resolving to the docker0 gateway. The runtime's callback URL is
      # built on that name, so removing this breaks every conversation.
      #
      # And it IS how the session reaches your model provider too — which
      # is the opposite of what an earlier version of this comment claimed.
      # The agent's LLM call is made from the runtime, not from here, so
      # `http://ollama:11434` cannot work: no DockHub container name
      # resolves on the default bridge. The runtime needs the provider's
      # published host port via this same name. deploy.sh works that URL
      # out and prints it; see its "Base URL" section.
      - "host.docker.internal:host-gateway"
    networks:
      - ai-net

networks:
  ai-net:
    external: true
