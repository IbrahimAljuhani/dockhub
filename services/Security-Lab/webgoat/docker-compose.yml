# OWASP WebGoat — DELIBERATELY VULNERABLE SOFTWARE.
#
# ⚠️ Read services/Security-Lab/README.md before touching this file. It
# carries the threat model this compose file is built around.
#
# The governing principle, restated:
#   The application must be vulnerable. The container must not be escapable.
#
# ONE CONTAINER, TWO APPS. WebGoat (the lessons, :8080) and WebWolf (the
# attacker-side companion, :9090) both run inside the single webgoat/webgoat
# image. Several lessons — the ones where you exfiltrate data to a server you
# control, or catch a request — genuinely do not work without WebWolf, and
# most guides omit it entirely because they only publish 8080.
#
# The older two-image split (webgoat/goatandwolf) was last built in 2021.
# Do not use it.
#
# ⚠️ WEBGOAT_HOST / WEBWOLF_HOST ARE ADVERTISED HOSTNAMES, NOT BIND ADDRESSES.
# WebGoat builds the links that send you between the two apps from these. Left
# unset they resolve to localhost, which is correct only if your browser runs
# on the server itself — from a laptop those links are dead, and the lesson
# looks broken rather than misconfigured. deploy.sh sets both to this host's
# LAN address, the same one the ports are bound to.
#
# For the record, since it is widely misreported: this image does NOT bind to
# localhost internally. Its Dockerfile ends with `--server.address 0.0.0.0`
# and it already runs as a non-root user. The `server.address` advice you'll
# find belongs to running the JAR standalone, outside Docker.
#
# This is a single-instance service, under ~/docker/webgoat/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/webgoat/ and runs it from there.

services:
  # ── A one-shot that fixes the volume's ownership, then exits ──────────
  # WITHOUT THIS THE APP DOES NOT START. Learned the hard way on
  # 2026-08-20: adding the named volume below broke a working deployment
  # with
  #   webgoat.lck (Permission denied)
  #
  # Docker creates a named volume's mount point owned by ROOT when the path
  # does not already exist inside the image. The image then runs as a
  # non-root user, which cannot write into a root-owned directory, so HSQLDB
  # never opens its lock file and Spring dies during startup.
  #
  # Exactly the same class of bug this project already handles for Flowise
  # and Langflow, where deploy.sh checks the uid before starting. The lesson
  # did not get carried across the first time.
  #
  # ⚠️ `webgoat:webgoat` BY NAME, never a number. The recovery command used
  # while debugging this discovered the container runs as **1001**, not the
  # 1000 that Flowise and Langflow use — so a hardcoded uid would have set
  # the wrong owner, left the service broken, and made the diagnosis look
  # wrong. The name resolves inside the image whatever the number is.
  #
  # Same image, so nothing extra is downloaded. It runs as root, creates the
  # directory and chowns it, then exits —
  # `service_completed_successfully` below is what makes the app wait.
  webgoat-init:
    image: webgoat/webgoat:${WEBGOAT_VERSION:-2026}
    container_name: webgoat-init
    user: root
    restart: "no"
    labels:
      dockhub.security-lab: "true"
    entrypoint: ["sh", "-c", "mkdir -p /home/webgoat/data && chown -R webgoat:webgoat /home/webgoat/data"]
    volumes:
      - webgoat-data:/home/webgoat/data
    networks:
      - seclab-net

  webgoat:
    depends_on:
      webgoat-init:
        condition: service_completed_successfully
    image: webgoat/webgoat:${WEBGOAT_VERSION:-2026}
    container_name: webgoat
    # NOT unless-stopped — a forgotten lab must not return after a reboot.
    restart: "no"
    labels:
      dockhub.security-lab: "true"
    environment:
      # Advertised hostnames — see the header. Not bind addresses.
      WEBGOAT_HOST: ${SECLAB_BIND}
      WEBWOLF_HOST: ${SECLAB_BIND}
      # The image defaults to Europe/Amsterdam. Several lessons compare
      # timestamps and misbehave when the container's clock is in a different
      # zone than yours, which reads as a broken lesson.
      TZ: ${WEBGOAT_TZ:-UTC}

      # ── A FIXED data directory, which is the whole point ───────────────
      # WebGoat's own configuration derives its data path from its build
      # version:
      #   webgoat.server.directory = ${user.home}/.webgoat-${webgoat.build.version}/
      #   spring.datasource.url    = jdbc:hsqldb:file:${webgoat.server.directory}/webgoat
      #
      # So out of the box the database moves every time the version changes.
      # An earlier version of this file tried to follow that by deriving the
      # path from the image tag — and that only works while the tag and the
      # jar's internal version agree. They need not: the `2026` tag has no
      # matching source release at all, so nothing guarantees it calls itself
      # "2026" internally. A mount at the wrong path fails SILENTLY — the app
      # starts, writes to an unmounted directory, and every completed lesson
      # disappears on the next recreate with no error anywhere.
      #
      # These two Spring properties are settable as environment variables, so
      # the path is simply pinned instead of predicted. It no longer depends
      # on the tag, the release, or anything upstream may rename.
      WEBGOAT_SERVER_DIRECTORY: /home/webgoat/data
      WEBGOAT_USER_DIRECTORY: /home/webgoat/data
    ports:
      - "${SECLAB_BIND}:${WEBGOAT_PORT:-8080}:8080"
      - "${SECLAB_BIND}:${WEBWOLF_PORT:-9090}:9090"
    # ── Containment ─────────────────────────────────────────────────────
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Deliberately far higher than Juice Shop's 200. This is a JVM, and on
    # Linux every Java thread counts against pids_limit — the JDK plus the
    # compiler some lessons invoke will blow past a low cap, and the failures
    # look like random lesson errors rather than a resource limit.
    pids_limit: 512

    # ── The image's own healthcheck is BROKEN. This replaces it. ─────────
    # Upstream ships:
    #   HEALTHCHECK --interval=5s --timeout=3s
    #     CMD curl --fail http://localhost:8080/WebGoat/actuator/health
    #
    # and the image does not contain curl. Measured on a live container:
    #
    #   "FailingStreak": 203
    #   "Output": "/bin/sh: 1: curl: not found\n"
    #
    # So every WebGoat container ever started from this image reports
    # `unhealthy` for its entire life, while the application is perfectly
    # fine — the same endpoint answers 200 with {"status":"UP"} from the
    # host. Portainer paints that amber and it reads as a fault.
    #
    # ⚠️ THE FIRST FIX WRITTEN HERE WAS WRONG, and is recorded because the
    # mistake is instructive. The symptom looked like a startup race — the
    # image sets no --start-period while this JVM needs ~18s to boot — so
    # the first version kept curl and merely added `start_period: 90s`.
    # That would have delayed the identical failure by ninety seconds and
    # called it a repair. The probe's own output is what settled it, not
    # the plausible story.
    #
    # ── NO EXTERNAL TOOL AT ALL, and that is the third attempt ───────────
    # Attempt 1 kept upstream's curl and added a start_period. curl is not in
    # the image; that would have delayed the same failure by 90 seconds.
    # Attempt 2 used wget, verified present in v2025.3 — and the `2026`
    # image ships NEITHER curl NOR wget. The tool inventory is not stable
    # across this project's own builds, so depending on one is the bug.
    #
    # bash IS in both images, and `/dev/tcp` is a bash builtin that needs
    # nothing installed. This speaks HTTP directly and reads the status line,
    # so it still asserts that WebGoat ANSWERS rather than merely that a port
    # is open — which matters here: this container runs two apps in one JVM,
    # and the real failure seen on 2026-08-20 was WebWolf alive on 9090 while
    # WebGoat's context had died on 8080.
    #
    # ["CMD", "bash", ...] and NOT CMD-SHELL: CMD-SHELL runs /bin/sh, which
    # on Ubuntu is dash, and dash has no /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /WebGoat/actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The start period is still correct and still needed — it just was
      # never the whole problem. A cold JVM on a loaded host is slower than
      # a warm one, and a false "unhealthy" costs somebody an afternoon
      # debugging a service that works.
      start_period: 90s
    # ── Resource limits, and they are NOT optional ───────────────────────
    # See juice-shop's compose for the full reasoning: the category README
    # promised `mem_limit` and `cpus`, the prompt made memory optional, and
    # `cpus` was set nowhere. Defaults that always apply, raised by the
    # prompt if you ask.
    #
    # 1g rather than Juice Shop's 512m: this is a JDK image and several
    # lessons compile Java at runtime. Too low here does not look like a
    # memory limit — it looks like a lesson that randomly fails.
    mem_limit: ${SECLAB_MEM:-1g}
    cpus: ${SECLAB_CPUS:-2}
    # ── Lesson progress, which used to vanish silently ───────────────────
    # WebGoat writes its HSQLDB to disk. With no volume, every
    # `docker compose down` or container recreate took your completed lessons
    # with it — and this service's README used to call that intentional, which
    # it was not. Juice Shop genuinely does reset by design (in-memory,
    # self-healing); WebGoat simply had nowhere to keep anything.
    #
    # The path is /home/webgoat/data because the environment block above
    # PINS it there. It is not WebGoat's own default, which moves with the
    # version — see the note on WEBGOAT_SERVER_DIRECTORY for why following
    # that default silently loses data the first time a tag and an internal
    # version disagree.
    #
    # ⚠️ Do not "simplify" this to /home/webgoat. webgoat.jar lives in that
    # directory, and a volume over it hides the application from its own
    # ENTRYPOINT — the container stops starting at all.
    volumes:
      - webgoat-data:/home/webgoat/data

    networks:
      - seclab-net

volumes:
  webgoat-data:
    name: webgoat-data

networks:
  # Shared with the other lab services, not private to this one. See
  # lib/common.sh, ensure_seclab_net.
  seclab-net:
    external: true
