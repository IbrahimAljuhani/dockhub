# llama.cpp — the inference engine, served directly.
#
# A provider, like Ollama. The difference that matters day to day:
#
#   Ollama     holds MANY models and switches between them on demand.
#   llama.cpp  loads ONE model and serves that.
#
# Both expose an OpenAI-compatible /v1, so Open WebUI and the agents talk to
# either without changes — but pointed at llama.cpp they will show a single
# model, which looks broken if you expected a list. It isn't. To serve a
# different model you change LLAMA_ARG_HF_REPO in .env and rerun deploy.sh.
#
# ── WHY THE IMAGE TAG IS THE WHOLE GPU DECISION ─────────────────────────
#   server        CPU build. No CUDA inside — a GPU on the host changes
#                 nothing, because the binary cannot use it.
#   server-cuda   CUDA build. Needed for any GPU acceleration at all.
# deploy.sh picks between them from what lib/gpu.sh actually detected, so
# the tag matches the machine rather than a guess.
#
# ── TWO THINGS THAT ARE *NOT* PROBLEMS, DESPITE WHAT GUIDES SAY ─────────
# Checked against upstream's own Dockerfile and server docs rather than
# assumed, because both are widely repeated as gotchas and both are stale:
#   - `--host` defaults to 127.0.0.1 in llama-server generally, which in a
#     container would mean nothing can reach it. The *server image already
#     sets LLAMA_ARG_HOST=0.0.0.0* in its Dockerfile, so there is nothing to
#     fix here.
#   - `-ngl` (GPU layers) defaults to `auto` in current llama.cpp, so the
#     CUDA build offloads on its own. Older guides insist you must pass
#     -ngl 99 or it silently runs on CPU; that is no longer true. The
#     override below exists for tuning, not for correctness.
#
# ── NO main-net, ON PURPOSE ─────────────────────────────────────────────
# Same as Ollama: this has no web interface worth proxying and no
# authentication on its API. It sits on ai-net where consumers reach it as
# http://llama-cpp:8080, and a host port is opt-in with a warning.
#
# This is a single-instance service, under ~/docker/llama-cpp/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/llama-cpp/ and runs it from there.

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_TAG:-server}
    container_name: llama-cpp
    restart: unless-stopped
    environment:
      # The model. `user/repo` alone is enough — the quant defaults to
      # Q4_K_M, or falls back to the first file in the repo. Downloaded on
      # first start into LLAMA_CACHE below.
      LLAMA_ARG_HF_REPO: ${LLAMA_ARG_HF_REPO}
      # Without this the download lands on the container filesystem and is
      # lost on every recreate — several gigabytes, re-fetched each time.
      LLAMA_CACHE: /models
      # Empty means `auto`, which is what you want. Set a number in .env
      # only when tuning a model that doesn't quite fit in VRAM.
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_ARG_N_GPU_LAYERS:-}
      # How many requests it will handle at once. 1 is the safe default on
      # a single consumer GPU: each parallel slot needs its own KV cache,
      # so raising this multiplies VRAM use rather than sharing it.
      LLAMA_ARG_N_PARALLEL: ${LLAMA_ARG_N_PARALLEL:-1}
    volumes:
      - llama-cpp-models:/models
    networks:
      - ai-net

volumes:
  llama-cpp-models:

networks:
  ai-net:
    external: true
