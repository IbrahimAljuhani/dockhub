# LocalAI — a provider, and the broadest one here.
#
# Ollama and llama.cpp serve text. LocalAI serves text, speech-to-text,
# text-to-speech and image generation from a single OpenAI-compatible API.
# That breadth is its reason to exist in this catalogue — not its OpenAI
# compatibility, which llama.cpp has too.
#
# ── THE IMAGE TAG IS TWO DECISIONS, NOT ONE ─────────────────────────────
# LocalAI's tags combine hardware and content:
#
#   latest-cpu                     hardware: CPU    content: empty
#   latest-gpu-nvidia-cuda-12      hardware: CUDA   content: empty
#   latest-aio-cpu                 hardware: CPU    content: AIO
#   latest-aio-gpu-nvidia-cuda-12  hardware: CUDA   content: AIO
#
# AIO = All-In-One: it arrives pre-configured with a model for each
# capability, mapped onto OpenAI's own names — gpt-4, gpt-4-vision-preview,
# text-embedding-ada-002, whisper-1, tts-1, stablediffusion. Anything written
# against the OpenAI API works unchanged.
#
# Without AIO you get an empty server and configure every model yourself,
# which is a reasonable choice but leaves LocalAI doing roughly what Ollama
# does with more effort. deploy.sh asks, and builds the tag from your answer
# plus what lib/gpu.sh detected.
#
# ⚠️ AIO downloads its whole model set on FIRST START, not at image pull.
# The container is "running" long before it is usable, and the download is
# tens of gigabytes on the GPU profile. deploy.sh waits on /readyz and shows
# progress rather than leaving you guessing.
#
# ── NO main-net ─────────────────────────────────────────────────────────
# Same posture as the other two providers: no authentication on the API, so
# ai-net only, never a public domain, and a host port only if you ask.
#
# This is a single-instance service, under ~/docker/localai/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/localai/ and runs it from there.

services:
  localai:
    image: localai/localai:${LOCALAI_TAG:-latest-aio-cpu}
    container_name: localai
    restart: unless-stopped
    environment:
      MODELS_PATH: /models
      # Set explicitly rather than left unset. An empty environment variable
      # is not an absent one, and this project has already been bitten by
      # that: an empty LLAMA_ARG_N_GPU_LAYERS put llama.cpp into a restart
      # loop because it parses the value instead of checking it exists.
      DEBUG: ${LOCALAI_DEBUG:-false}
    volumes:
      # FOUR paths, not one. Upstream is explicit that /models, /backends,
      # /configuration and /data must all be persisted, and the container
      # paths have to be exactly those names.
      #
      # Mounting only /models is a trap this project fell into and a live test
      # caught: after removing and redeploying, LocalAI re-downloaded several
      # gigabytes of CUDA backends even though 13 GB of models were still on
      # disk. The models had survived; the BACKENDS had not, because they live
      # in /backends and that was still inside the container.
      #
      # Split by what the data is, which lines up with how it is backed up:
      #   models + backends → the shared AI models directory. Large,
      #                       re-downloadable, deliberately skipped by backup.
      #   configuration + data → the service's own directory. Small, yours,
      #                       and captured by backup_localai().
      #
      # ⚠️ /backends materialises symlinks as real files on filesystems that
      # cannot create links (some CIFS/SMB mounts), using more space. On a
      # normal local filesystem this does not apply.
      - ${AI_MODELS_PATH:?AI_MODELS_PATH is unset — run deploy.sh, which resolves it}/models:/models
      - ${AI_MODELS_PATH}/backends:/backends
      - ./configuration:/configuration
      - ./data:/data
    networks:
      - ai-net

networks:
  ai-net:
    external: true
