# Ollama — the model provider, from the official image.
#
# Runs language models locally and serves them over an API. Everything else
# in DockHub's AI, AI-Agents and Multi-Agent categories is a *consumer* of
# something like this — or of a cloud API key instead.
#
# ── WHY THERE IS NO PUBLISHED PORT BY DEFAULT ───────────────────────────
# Ollama's API has NO AUTHENTICATION. None. Anything that can reach port
# 11434 can list your models, run inference on your hardware, and read the
# prompts you send. So the default here is the same as every other service
# in this repo: no host port, reachable only by container name over a shared
# Docker network. deploy.sh offers a host port for people who want to point
# tools outside Docker at it, and says plainly what that means.
#
# ── ai-net, NOT main-net ────────────────────────────────────────────────
# Consumers reach this at http://ollama:11434 over 'ai-net'. It is
# deliberately NOT on main-net: there is nothing here for NGINX Proxy
# Manager to serve — no web interface, no login page — and putting an
# unauthenticated API on the network with every other service earns nothing.
#
# ── GPU ─────────────────────────────────────────────────────────────────
# The GPU block is NOT in this file. It's written into
# docker-compose.override.yml by deploy.sh, and only after lib/gpu.sh has
# proved that a container can actually reach the GPU on this host — a real
# test container, not just "an NVIDIA card exists". Baking `deploy:
# resources: reservations: devices:` in here unconditionally would make the
# service fail to start on every CPU-only machine, which is most of them.
#
# ── MODELS ──────────────────────────────────────────────────────────────
# They live in the ollama-models volume, in Ollama's own content-addressed
# store — blobs plus manifests, not plain .gguf files. That is why models
# cannot be shared with llama.cpp or LocalAI even though all three can run
# the same underlying weights.
#
# This is a single-instance service, under ~/docker/ollama/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/ollama/ and runs it from there.

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: unless-stopped
    environment:
      # Listen on all interfaces INSIDE the container — without this Ollama
      # binds 127.0.0.1 and other containers cannot reach it, which looks
      # exactly like a broken network. Same class of trap as Mosquitto's
      # local-only default and WebGoat's standalone-JAR binding.
      OLLAMA_HOST: "0.0.0.0:11434"
      # How long a model stays resident after its last request. 5m is
      # Ollama's own default — repeated here so the knob is visible and
      # editable in .env rather than buried in upstream's defaults, not
      # because DockHub disagrees with it.
      #
      # Lower it on a machine sharing RAM or VRAM with other services, where
      # several idle gigabytes are worth reclaiming. Raise it if you use
      # Ollama constantly and dislike the reload pause on the first request
      # after a gap.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      # A HOST DIRECTORY, not a named volume — see resolve_ai_models_dir() in
      # lib/common.sh. Models are the largest thing DockHub downloads, and a
      # named volume buries them in /var/lib/docker/volumes where you can
      # neither see the space nor move it to a bigger disk. deploy.sh sets
      # this and proves the container can write there before starting.
      #
      # Note what lands here: Ollama does NOT store plain .gguf files. It
      # repacks weights into a content-addressed store (blobs/sha256-… plus
      # manifests/), which is why this directory cannot be shared with
      # llama.cpp or LocalAI even when running the same model.
      - ${AI_MODELS_PATH:?AI_MODELS_PATH is unset — run deploy.sh, which resolves it}:/root/.ollama
    networks:
      - ai-net

networks:
  ai-net:
    external: true
