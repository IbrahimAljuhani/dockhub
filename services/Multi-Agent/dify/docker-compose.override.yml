# Dify — DockHub's layer over upstream's compose file.
#
# ── WHY THIS IS AN OVERRIDE AND NOT A COMPOSE FILE OF OUR OWN ───────────
# Every other service in this catalogue ships a docker-compose.yml we wrote
# and you can read end to end. Dify cannot work that way, and the reason is
# measured, not aesthetic:
#
#   · upstream's docker/docker-compose.yaml is 1,345 lines and declares 39
#     services, most behind optional profiles
#   · it mounts RELATIVE PATHS that live beside it — ./nginx/nginx.conf.template,
#     ./nginx/conf.d, ./ssrf_proxy/, ./startupscripts/ — so the compose file
#     alone is useless; the whole docker/ tree is required
#   · it is regenerated from a template every release
#
# Re-implementing that by hand would be a fork we could not keep correct, and
# a stale copy of someone else's orchestration is worse than no copy. So
# deploy.sh fetches upstream's docker/ tree at a PINNED TAG, and this file is
# the only thing DockHub adds. Everything below is a deliberate decision;
# read it as the diff between "what Dify ships" and "what DockHub deploys".
#
# The pin lives in deploy.sh (DIFY_VERSION). Upstream's own compose hardcodes
# the same version in its image tags, so the two move together by design.

services:
  nginx:
    # ── 1. A NAME NPM CAN FIND ───────────────────────────────────────────
    # Upstream sets no container_name, so the container ends up called
    # something like dify-nginx-1 or docker-nginx-1 depending on the compose
    # project name — a moving target for a reverse-proxy entry you type once.
    container_name: dify-nginx

    # ── 2. THE PORT COLLISION THAT WOULD HAVE BROKEN THE HOST ────────────
    # Upstream publishes  ${EXPOSE_NGINX_PORT:-80}:80  and  443:443.
    # DockHub's NGINX Proxy Manager already owns 80 and 443 on this host, so
    # deploying Dify unchanged would fight the very proxy that is supposed to
    # serve it — and on a VPS that means taking the whole host's HTTP down.
    #
    # Emptying the list removes BOTH published ports. Dify is then reached
    # only through main-net, by name, which is how every other service in
    # this catalogue is reached. deploy.sh offers an optional host port and
    # writes it back into this list when you ask for one.
    #
    # The marker on the next line is required. deploy.sh substitutes the
    # chosen host port into it, and there is now a SECOND identical
    # `ports: !override []` further down on plugin_daemon. Without something
    # to aim at, that substitution matched BOTH — publishing the plugin
    # debugging daemon on the web port and silently undoing the fix that
    # closed it. Caught by rendering the generated file, not by reading it.
    ports: !override []   # DOCKHUB:HOSTPORT

    networks:
      # Upstream's default network, so nginx can still reach api/web. Named
      # explicitly because declaring `networks:` at all replaces the implicit
      # default membership — omitting it here would cut nginx off from the
      # application it proxies.
      - default
      # The marker is load-bearing: deploy.sh deletes this line, and the
      # matching block at the end of the file, when you decline main-net.
      - main-net   # DOCKHUB:MAINNET

  api:
    # ── 4. A NAME FOR THE THING YOU ARE TOLD TO WATCH ────────────────────
    # deploy.sh tells you to run `docker logs -f dify-api` when the first
    # boot is slow. Without this the container is called dify-api-1 and that
    # command fails — an instruction that does not work is worse than none.
    # It also gives the readiness probe a container with python in it;
    # nginx:latest has neither wget nor curl, which is why the first version
    # of that probe could never succeed.
    container_name: dify-api

  plugin_daemon:
    # ── 5. THE DOOR WE LEFT OPEN WHILE CLOSING THE FRONT ONE ─────────────
    # Upstream publishes a host port here too:
    #
    #     ports:
    #       - "${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    #
    # and .env sets PLUGIN_DEBUGGING_HOST=0.0.0.0. That is the plugin REMOTE
    # DEBUGGING endpoint, bound to every interface — published whether or not
    # you asked for a host port, and regardless of the main-net answer.
    #
    # We removed nginx's 80 and 443 with some care and did not notice this
    # one until it showed up in a Portainer container list as 5003:5003.
    # Closing the front door while a side door stays open is not a smaller
    # version of security; it is the appearance of it.
    #
    # It is for developing plugins against a running instance, not for
    # running them. If you ever need it, publish it deliberately and to
    # 127.0.0.1, then reach it over SSH — the same rule this project applies
    # to OpenHands and Hermes.
    ports: !override []

  # ── 6. HARDENING, SCOPED TO WHAT IT ACTUALLY BUYS ──────────────────────
  # Upstream sets no cap_drop, security_opt or read_only on ANY of its 39
  # services — checked, not assumed. Paperclip and all three AI-Agents carry
  # DockHub's three-capability block, so Dify was the odd one out.
  #
  # But it is applied HERE ONLY, to the three containers that run code or
  # plugins, and not blanket across fifteen. Two reasons:
  #
  #   · The value is concentrated. Upstream's network isolation already does
  #     the heavy lifting — `sandbox` sits on ssrf_proxy_network alone and
  #     cannot reach the database, Redis, Weaviate or main-net. These flags
  #     are defence in depth on top of a real boundary, not a substitute for
  #     one.
  #   · The risk is not zero. squid (ssrf_proxy) can use NET_RAW for its
  #     optional ICMP pinger, and postgres/redis/weaviate gain nothing from
  #     being poked at. Dropping capabilities from containers whose needs we
  #     have not measured is how a stack breaks in a way nobody connects back
  #     to a security change.
  #
  # ⚠️ NOT yet verified on a running server. Watch these three specifically
  # on the next deploy; if one refuses to start, this block is the first
  # place to look. Verify what actually applied with:
  #   docker exec dify-sandbox-1 grep -E '^(CapEff|NoNewPrivs)' /proc/self/status
  # Written out twice rather than shared with a YAML anchor. An anchor would
  # be tidier and I could not verify it expands the way I expect under this
  # Compose version — and this session has already shipped two "obviously
  # fine" constructs that were not. Ten explicit lines beat five clever ones
  # when the clever ones cannot be tested.
  sandbox:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - MKNOD
      - NET_RAW
      - AUDIT_WRITE
    pids_limit: 4096

  local_sandbox:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - MKNOD
      - NET_RAW
      - AUDIT_WRITE
    pids_limit: 4096

  # Weaviate's anonymous-access fix is NOT here. It belongs in .env, because
  # upstream's compose already reads
  #     AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_..._ENABLED:-false}
  # — their own default is already false; it is .env.example that flips it to
  # true. Using their knob instead of overriding the container keeps this
  # file to things upstream gives no switch for. See deploy.sh.

  db_postgres:
    # ── 3. A NAME backup.sh CAN REACH ────────────────────────────────────
    # Upstream names only the exotic vector stores; the database it actually
    # ships with is left to compose's automatic naming. backup.sh needs a
    # fixed target for `docker exec … pg_dump`, and a name that changes with
    # the project directory is not one.
    #
    # Worth knowing where this data lives: ./volumes/db/data — a BIND MOUNT
    # inside the install directory, not a named volume. So it travels with
    # the install tree in a DockHub backup, and it is written by postgres as
    # its own uid. Before 2026-08-19 that combination silently produced
    # archives with no database in them at all; see lib/common.sh's
    # backup_service_generic for what was wrong and why it is fixed.
    container_name: dify-db

# DOCKHUB:MAINNET-BLOCK-START
networks:
  main-net:
    external: true
# DOCKHUB:MAINNET-BLOCK-END
