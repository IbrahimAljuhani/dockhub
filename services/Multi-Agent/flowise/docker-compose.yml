# Flowise — drag-and-drop LLM flow builder on LangChain.
#
# Still the lightest thing in this category, at two containers. Unlike Dify —
# whose 1,345-line compose forced us to fetch upstream's tree — this one is
# written here in full, so you can read every line of what you deploy.
#
# It was meant to be ONE container. Note 3 below is why it is not, and that
# note is the most important thing in this file.
#
# ── DELIBERATE DEVIATIONS FROM UPSTREAM'S OWN COMPOSE ───────────────────
#
# 1. DATA LIVES INSIDE THE INSTALL DIRECTORY.
#    Upstream mounts `~/.flowise:/home/node/.flowise` — the invoking user's
#    HOME, outside anything DockHub manages. Every backup in this project
#    archives ~/docker/<service>/, so that layout would produce archives with
#    none of your flows, credentials or uploaded files in them, reporting
#    success. Here it is ./data, inside the tree that gets backed up.
#
# 2. NO HOST PORT UNLESS ASKED, AND NEVER 3000.
#    Upstream publishes `${PORT}:${PORT}`, and PORT defaults to 3000 — which
#    in this catalogue already belongs to Open WebUI, and is why OpenHands
#    was moved to 3001. NPM reaches this by container name on main-net;
#    deploy.sh offers a host port and suggests 3200.
#
# 3. POSTGRES, BECAUSE SQLITE DOES NOT START — measured, not preferred.
#    This began as a one-container SQLite deployment, which is what the
#    category README advertises. It crash-looped on 3.1.4 AND on latest:
#
#      TypeError: this.db.exec is not a function
#        at new SQLiteStore (connect-sqlite3/lib/connect-sqlite3.js:56)
#        at initializeDBClientAndStore (enterprise/.../SessionPersistance.js:96)
#
#    Pinning did not fix it — that was tried first, and 3.1.4 crashed in
#    exactly the same place. Reading the failing function settled it.
#    Flowise picks its SESSION store
#    from DATABASE_TYPE, defaulting to sqlite, and the sqlite branch uses
#    `connect-sqlite3`. The image ships that package without a working
#    `sqlite3` under it — so `this.db` is not a database handle.
#
#    Crucially, the log also showed "Data Source initialized successfully"
#    and "Database migrations completed successfully": Flowise's MAIN sqlite
#    database works fine. Only the session store is broken, and only because
#    it reaches for a different sqlite library than TypeORM does. Nothing in
#    .env can route around that.
#
#    The postgres branch uses connect-pg-simple instead, which the image does
#    carry. So this service costs a second container — and stops being the
#    "one container" the category promised. That claim was corrected rather
#    than the deployment being left broken to protect it.
#
#    Verified live 2026-08-19: "Auth initialized successfully", then
#    "Flowise Server is listening at :3000". Both containers healthy.
#
# 4. TELEMETRY OFF, and upstream already agrees — their own example ships
#    DISABLE_FLOWISE_TELEMETRY=true. Kept explicit so an image default cannot
#    quietly change it.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it (and
# the generated .env) to ~/docker/flowise/ and runs it from there.

services:
  flowise:
    # The fallback is a real version, NOT `latest`. deploy.sh always writes
    # FLOWISE_VERSION into .env, so this only fires if that file is missing or
    # hand-edited — and on this image `latest` is an EARLIER build than the
    # tagged release (different digest, pushed first) which crash-loops on
    # startup. There should be no path in this repo that reaches it.
    image: flowiseai/flowise:${FLOWISE_VERSION:-3.1.4}
    container_name: flowise
    restart: unless-stopped
    env_file:
      - .env

    # ── Hardening ────────────────────────────────────────────────────────
    # Warranted here more than in most of this catalogue, and for a specific
    # reason: Flowise's Custom Tool nodes run JavaScript you (or a model
    # acting for you) write, and upstream's own example allows those tools to
    # `require('fs')` — see TOOL_FUNCTION_BUILTIN_DEP in .env. Code with
    # filesystem access is exactly the case these three flags exist for.
    #
    # From the OpenSandbox trial (2026-08-17): of the nine capabilities that
    # config drops, six were never in Docker's default grant. These three are
    # the whole real difference — 11 capabilities instead of 14. Verify:
    #   docker exec flowise grep -E '^(CapEff|NoNewPrivs)' /proc/self/status
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - MKNOD
      - NET_RAW
      - AUDIT_WRITE
    pids_limit: 4096

    environment:
      # The container's own port. The HOST port, if any, is set separately in
      # docker-compose.override.yml so that changing one never silently moves
      # the other.
      PORT: 3000
      # Postgres — see note 3 in the header. Both the main data source AND
      # the session store read these, which is the point: the sqlite session
      # store is the thing that does not work.
      DATABASE_TYPE: postgres
      DATABASE_HOST: flowise-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_USER: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      # These paths still matter with Postgres: the encryption key, uploads
      # and logs are files regardless of where the tables live. Upstream's
      # example leaves them as /your_*_path placeholders — unset, uploads and
      # logs land in the image's ephemeral layer, where replacing the
      # container destroys them.
      SECRETKEY_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
      DISABLE_FLOWISE_TELEMETRY: "true"

    volumes:
      # A bind mount, not a named volume: this holds your flows, the
      # encrypted credential store and everything you upload. Inside the
      # install directory it travels with the DockHub backup; a named volume
      # would too, but a directory you can open and read is worth more when
      # something has gone wrong.
      - ./data:/home/node/.flowise

    depends_on:
      flowise-db:
        condition: service_healthy

    healthcheck:
      # Upstream's own endpoint, taken from their compose rather than guessed.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/v1/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    # ── NO `networks:` KEY HERE, AND THAT IS DELIBERATE ──────────────────
    # docker-compose.override.yml, which deploy.sh generates, owns the
    # network membership entirely — including the top-level declaration.
    #
    # The reason is a Compose rule that is easy to get wrong: a service's
    # `networks:` list MERGES across files, it does not replace. So if this
    # file said `- main-net` and the override said `- flowise-net`, the
    # result would be BOTH — and answering "no" to the main-net question
    # would join main-net anyway. Dify hit the same rule with `ports:` and
    # needed the Compose 2.24 `!override` tag to escape it. Leaving the key
    # out here achieves the same thing with no version requirement.
    #
    # Consequence worth knowing: this file is not runnable on its own. It is
    # never meant to be — deploy.sh always writes the override beside it, and
    # Compose loads that automatically.

  flowise-db:
    image: postgres:17-alpine
    container_name: flowise-db
    restart: unless-stopped

    # ── Hardening, the same three flags as the app beside it ─────────────
    # This container used to be the odd one out: the app next to it dropped
    # capabilities while the database holding all of its data ran with
    # Docker's full default grant. An asymmetry with no reason behind it.
    #
    # Safe for postgres specifically, and worth saying why rather than
    # asserting it. The official image starts as root and drops to the
    # postgres user with gosu, which calls setuid() DIRECTLY while still
    # root — it does not exec a setuid binary. `no-new-privileges` only
    # blocks privileges GAINED through execve (setuid bits, file
    # capabilities), so it cannot interfere with an already-root process
    # giving privileges up. And postgres needs none of these three: it
    # creates no device nodes, opens no raw sockets, writes no audit records.
    #
    # Everything the entrypoint DOES need — CHOWN, DAC_OVERRIDE, FOWNER,
    # SETUID, SETGID, to fix ownership of the data directory and then drop
    # privileges — is deliberately left in place.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - MKNOD
      - NET_RAW
      - AUDIT_WRITE
    # Generous on purpose: postgres forks a backend process per connection,
    # so a limit tuned to "feels like enough" becomes refused connections
    # under a load nobody predicted.
    pids_limit: 4096

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      # A NAMED volume, unlike the app's ./data bind mount above, and for two
      # reasons. The postgres image chowns its data directory to uid 999, so a
      # bind mount here would leave a tree the invoking user cannot read or
      # delete. And backup_service_generic already walks a service's named
      # volumes — this is the same shape paperclip-db uses, so the shared
      # backup machinery needs no special case.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost tests the TCP listener the app will actually use. Bare
      # pg_isready succeeds on the unix socket while the network listener is
      # still coming up, which lets the app start too early and fail its
      # first connection.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Never on main-net: the database is reachable by the app and nothing
    # else. The override gives the APP its network; this one gets a private
    # link that exists whichever answer you gave.
    networks:
      - flowise-db-net

volumes:
  db-data:

networks:
  # Declared HERE, not in the override, because neither of these is a choice:
  # both exist whichever answer you gave the main-net question. The override
  # still owns the app's OTHER network, and top-level `networks:` maps merge
  # across files, so the declarations coexist rather than collide.
  flowise-db-net:
  # The shared model-provider network, so a flow can point at an Ollama /
  # llama.cpp / LocalAI deployed from the AI category BY CONTAINER NAME —
  # http://ollama:11434 rather than a published host port.
  #
  # This was missing until 2026-08-19, and its absence made deploy.sh a liar:
  # prompt_agent_network prints "Flowise will run on 'ai-net', where it can
  # reach the model provider. That is all it needs to work." while nothing
  # joined it. The only route left was the host's LAN address and a published
  # Ollama port — which means exposing an API that has no authentication at
  # all, to get a connection Docker was willing to make privately.
  #
  # Declared external and joined from the override (membership is what
  # merges), the same shape paperclip uses.
  ai-net:
    external: true
